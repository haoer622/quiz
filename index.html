<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠務英文縮寫筆試 (50題模擬考版)</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--primary:#2563eb;--good:#16a34a;--bad:#dc2626;--border:#dfe3e8}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:22px;margin:0}.stats{font-size:14px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 4px 18px #0000000b;border:1px solid var(--border)}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:18px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:26px}.bar{height:100%;background:var(--primary);width:0;transition:.2s}
.question{text-align:center;padding:14px 0 26px}.label{font-size:15px;color:var(--muted)}.abbr{font-size:42px;font-weight:800;letter-spacing:1px;margin-top:8px;word-break:break-word}
.options{display:grid;gap:12px}.opt{width:100%;text-align:left;padding:16px;border:2px solid var(--border);background:white;border-radius:12px;font-size:16px;cursor:pointer;transition:.15s}.opt:hover{border-color:#93b4f7;background:#f8fbff}.opt:disabled{cursor:default}.opt .letter{font-weight:800;margin-right:9px;color:var(--primary)}
.opt.correct{border-color:var(--good);background:#f0fdf4}.opt.wrong{border-color:var(--bad);background:#fef2f2}.opt.dim{opacity:.6}
.feedback{margin-top:16px;padding:14px;border-radius:10px;display:none;line-height:1.55}.feedback.good{display:block;background:#f0fdf4;color:#166534}.feedback.bad{display:block;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:10px;margin-top:18px;align-items:center}.btn{border:0;border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer}.btn:disabled{opacity:0.4;cursor:not-allowed}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2f7;color:#273244}.danger{background:#fef2f2;color:var(--bad);border:1px solid #fca5a5}
.right-actions{display:flex;gap:10px;margin-left:auto}
.menu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.menu button{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:99px;cursor:pointer}.menu button.active{background:#eaf1ff;border-color:#9ab9ff;color:#1d4ed8}
.result{padding:20px}
.result-header{text-align:center;margin-bottom:24px}
.score{font-size:54px;font-weight:800;margin:10px 0}.score.pass{color:var(--good)}.score.fail{color:var(--bad)}
.result p{color:var(--muted);margin:6px 0}.result .row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.review-section{margin-top:28px;border-top:1px dashed var(--border);padding-top:20px}
.review-title{font-size:18px;font-weight:bold;margin-bottom:14px;text-align:left;color:var(--text)}
.review-list{display:grid;gap:10px;text-align:left}
.review-item{background:#f8fafc;border:1px solid var(--border);padding:12px 16px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.review-abbr{font-weight:bold;font-size:18px;color:var(--primary)}
.review-meaning{color:var(--good);font-weight:600}
.small{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.abbr{font-size:34px}.review-item{flex-direction:column;align-items:flex-start}}
</style>
</head>

<div class="wrap">
<header>
  <h1>廠務英文縮寫筆試</h1>
  <div class="stats" id="statsHeader">錯題: <span id="wrongCount">0</span> | 熟練區: <span id="masteredCount">0</span></div>
</header>
<div class="menu">
<button id="examBtn" class="active" onclick="setMode('exam')">50題隨機模擬考</button>
<button id="allBtn" onclick="setMode('all')">全題庫刷題 (399題)</button>
<button id="wrongBtn" onclick="setMode('wrong')">錯題重考 <span id="wrongCountBtn">0</span></button>
<button onclick="startExam()">換一組題目 (重新開始)</button>
<button class="danger" onclick="clearWrong()">清空錯題</button>
<button class="danger" onclick="clearMastered()">清空熟練區</button>
<button class="secondary" onclick="exportData()">匯出資料</button>
<button class="secondary" onclick="importData()">匯入資料</button>
</div>
<div class="card" id="quizCard">

  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="question"><div class="label">下列英文縮寫的中文意義是？</div><div class="abbr" id="abbr"></div></div>
  <div class="options" id="options"></div>
  <div id="feedback" class="feedback"></div>
  <div class="actions">
    <button class="btn secondary" id="prevBtn" onclick="prevQuestion()" disabled>上一題</button>
    <div class="right-actions">
      <button class="btn secondary" id="skipBtn" onclick="skipQuestion()">跳過</button>
      <button class="btn primary" id="nextBtn" style="display:none" onclick="nextQuestion()">下一題</button>
    </div>
  </div>
</div>
<div class="card" id="resultCard" style="display:none"></div>
<div class="small">總題庫共 399 筆 | 模擬考每次隨機抽 50 題，每題 2 分，滿分 100 分。</div>
</div>

  try {

function setMode(m){
  mode=m;
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  if(m==='exam') document.getElementById('examBtn').classList.add('active');
  else if(m==='all') document.getElementById('allBtn').classList.add('active');
  else if(m==='wrong') document.getElementById('wrongBtn').classList.add('active');
  startExam();
}

function startExam(){
  let source = DATA;
  if(mode==='exam'){
    source = DATA.filter(x => !masteredSet.has(x.abbr));
    if(source.length === 0){
      alert("太厲害了！所有題目都已經加入熟練區了！將為您重置熟練區重新開始。");
      masteredSet.clear();
      saveStorage();
      source = DATA;
    }
  } else if(mode==='wrong'){
    source = DATA.filter(x=>wrongSet.has(x.abbr));
  }
  
  if(mode==='wrong' && !source.length){showNoWrong();return}
  
  let shuffled = shuffle(source);
  if(mode==='exam'){
    deck = shuffled.slice(0, 50);
  } else {
    deck = shuffled;
  }
  
  idx = 0;
  records = deck.map(item => ({
    item: item,
    options: makeOptions(item.meaning),
    userChoice: null,
    isCorrect: null,
    isAnswered: false
  }));

  document.getElementById('quizCard').style.display='block';
  document.getElementById('resultCard').style.display='none';
  render();
}

function showNoWrong(){
  document.getElementById('quizCard').style.display='none';
  let r=document.getElementById('resultCard');
  r.style.display='block';
  r.innerHTML='<div class="result" style="text-align:center;"><h2>目前沒有錯題 🎉</h2><p>答錯的題目會自動記錄於此。</p><button class="btn primary" onclick="setMode(\'exam\')">開始 50 題模擬考</button></div>';
}

function makeOptions(correctMeaning){
  const pool=[...new Set(DATA.map(x=>x.meaning).filter(x=>x!==correctMeaning))];
  return shuffle([correctMeaning,...shuffle(pool).slice(0,3)]);
}

function render(){
  if(idx >= deck.length){finish(); return}
  
  const currentRecord = records[idx];
  const currentItem = currentRecord.item;
  
  document.getElementById('counter').textContent=`第 ${idx+1} / ${deck.length} 題`;
  const answeredCount = records.filter(r => r.isAnswered).length;
  const correctCount = records.filter(r => r.isCorrect === true).length;
  
  if(mode==='exam') {
    document.getElementById('accuracy').textContent=`當前得分: ${correctCount * 2} 分`;
  } else {
    document.getElementById('accuracy').textContent = answeredCount ? `正確率 ${Math.round(correctCount/answeredCount*100)}%` : '';
  }
  
  document.getElementById('bar').style.width = ((idx)/deck.length*100)+'%';
  document.getElementById('abbr').textContent = currentItem.abbr;
  document.getElementById('prevBtn').disabled = (idx === 0);
  
  const box = document.getElementById('options');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  
  currentRecord.options.forEach((o, i) => {
    let b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${letters[i]}.</span>${escapeHtml(o)}`;
    b.onclick = () => answer(b, o);
    box.appendChild(b);
  });
  
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';
  
  if(currentRecord.isAnswered) {
    const buttons = [...box.children];
    buttons.forEach(b => b.disabled = true);
    document.getElementById('skipBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
    
    buttons.forEach(b => {
      const choiceText = b.textContent.replace(/^[A-D]\.\s*/, '');
      
      if(currentRecord.isCorrect) {
        if(choiceText === currentRecord.userChoice) {
          b.classList.add('correct');
        } else {
          b.classList.add('dim');
        }
      } else {
        if(choiceText === currentItem.meaning) {
          b.classList.add('correct');
        } else if(choiceText === currentRecord.userChoice) {
          b.classList.add('wrong');
        } else {
          b.classList.add('dim');
        }
      }
    });
    
    if(currentRecord.isCorrect) {
      fb.className = 'feedback good';
      fb.innerHTML = '✓ 答對了！已加入熟練區';
    } else if(currentRecord.userChoice === 'SKIP') {
      fb.className = 'feedback bad';
      fb.innerHTML = `已跳過<br>正確答案：<strong>${escapeHtml(currentItem.meaning)}</strong>`;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = `✗ 答錯了<br>正確答案：<strong>${escapeHtml(currentItem.meaning)}</strong>`;
    }
  } else {
    document.getElementById('skipBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').style.display = 'none';
  }
  
  window.scrollTo({top:0,behavior:'smooth'});
}

function answer(btn, choice){
  const currentRecord = records[idx];
  if(currentRecord.isAnswered) return;
  
  const ok = choice === currentRecord.item.meaning;
  currentRecord.isAnswered = true;
  currentRecord.userChoice = choice;
  currentRecord.isCorrect = ok;
  
  if(ok){
    wrongSet.delete(currentRecord.item.abbr);
    if(mode === 'exam') {
      masteredSet.add(currentRecord.item.abbr);
    }
  } else {
    wrongSet.add(currentRecord.item.abbr);
  }
  saveStorage();
  render();
}

function skipQuestion(){
  const currentRecord = records[idx];
  if(currentRecord.isAnswered) return;
  
  currentRecord.isAnswered = true;
  currentRecord.userChoice = 'SKIP';
  currentRecord.isCorrect = false;
  
  wrongSet.add(currentRecord.item.abbr);
  saveStorage();
  render();
}

function nextQuestion(){
  idx++;
  render();
}

function prevQuestion(){
  if(idx > 0) {
    idx--;
    render();
  }
}

function finish(){
  document.getElementById('quizCard').style.display='none';
  const r=document.getElementById('resultCard');
  r.style.display='block';
  
  const correctCount = records.filter(x => x.isCorrect === true).length;
  const wrongRecords = records.filter(x => x.isCorrect === false);
  
  let reviewHtml = '';
  if(wrongRecords.length > 0) {
    reviewHtml = `
      <div class="review-section">
        <div class="review-title">本次錯題總回顧 (${wrongRecords.length} 題)</div>
        <div class="review-list">
          ${wrongRecords.map(item => `
            <div class="review-item">
              <span class="review-abbr">${escapeHtml(item.item.abbr)}</span>
              <span class="review-meaning">${escapeHtml(item.item.meaning)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else {
    reviewHtml = `
      <div class="review-section">
        <div class="review-title" style="text-align:center; color:var(--good)">全對！太棒了，沒有錯題！ 🎉</div>
      </div>
    `;
  }
  
  if(mode==='exam') {
    const finalScore = correctCount * 2;
    const isPass = finalScore >= 80;
    const scoreClass = isPass ? 'pass' : 'fail';
    const evalText = isPass ? '🎉 恭喜及格！觀念很紮實喔！' : '💪 差一點點，再多複習錯題吧！';
    
    r.innerHTML=`<div class="result">
      <div class="result-header">
        <div>模擬考得分</div>
        <div class="score ${scoreClass}">${finalScore} <span style="font-size:24px;color:var(--text)">分</span></div>
        <p>${evalText}<br>答對 ${correctCount} / 50 題 (熟練區累積 ${masteredSet.size} 題)</p>
        <div class="row">
          <button class="btn primary" onclick="startExam()">再考一次 (隨機50題)</button>
          <button class="btn secondary" onclick="setMode('wrong')">重考錯題</button>
        </div>
      </div>
      ${reviewHtml}
    </div>`;
  } else {
    const totalAnswered = records.filter(x => x.isAnswered).length;
    const pct = totalAnswered ? Math.round(correctCount / totalAnswered * 100) : 0;
    
    r.innerHTML=`<div class="result">
      <div class="result-header">
        <div>本次刷題完成</div>
        <div class="score">${pct}%</div>
        <p>${correctCount} / ${totalAnswered} 題答對<br>熟練區累積 ${masteredSet.size} 題</p>
        <div class="row">
          <button class="btn primary" onclick="startExam()">重新刷題</button>
          <button class="btn secondary" onclick="setMode('wrong')">重考錯題</button>
        </div>
      </div>
      ${reviewHtml}
    </div>`;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

startExam();
</script>
</body>
</html>
