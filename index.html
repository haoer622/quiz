<title>廠務英文縮寫筆試 (50題模擬考版)</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--primary:#2563eb;--good:#16a34a;--bad:#dc2626;--border:#dfe3e8}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:22px;margin:0}.stats{font-size:14px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 4px 18px #0000000b;border:1px solid var(--border)}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:18px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:26px}.bar{height:100%;background:var(--primary);width:0;transition:.2s}
.question{text-align:center;padding:14px 0 26px}.label{font-size:15px;color:var(--muted)}.abbr{font-size:42px;font-weight:800;letter-spacing:1px;margin-top:8px;word-break:break-word}
.options{display:grid;gap:12px}.opt{width:100%;text-align:left;padding:16px;border:2px solid var(--border);background:white;border-radius:12px;font-size:16px;cursor:pointer;transition:.15s}.opt:hover{border-color:#93b4f7;background:#f8fbff}.opt:disabled{cursor:default}.opt .letter{font-weight:800;margin-right:9px;color:var(--primary)}
.opt.correct{border-color:var(--good);background:#f0fdf4}.opt.wrong{border-color:var(--bad);background:#fef2f2}.opt.dim{opacity:.6}
.feedback{margin-top:16px;padding:14px;border-radius:10px;display:none;line-height:1.55}.feedback.good{display:block;background:#f0fdf4;color:#166534}.feedback.bad{display:block;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2f7;color:#273244}.danger{background:#fef2f2;color:var(--bad);border:1px solid #fca5a5}.next{display:none;margin-left:auto}
.menu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.menu button{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.menu button.active{background:#eaf1ff;border-color:#9ab9ff;color:#1d4ed8}
.result{text-align:center;padding:20px}.score{font-size:54px;font-weight:800;margin:10px 0}.score.pass{color:var(--good)}.score.fail{color:var(--bad)}
.result p{color:var(--muted)}.result .row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.small{font-size:13px;color:var(--muted);margin-top:16px;text-align:center}
@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.abbr{font-size:34px}}
</style>
</head>

</div>

let mode='exam', deck=[], idx=0, correct=0, answered=0, wrongSet=new Set();
let current=null, locked=false;

function loadWrong(){try{return new Set(JSON.parse(localStorage.getItem('wrongSet')||'[]'))}catch(e){return new Set()}}
function saveWrong(){localStorage.setItem('wrongSet', JSON.stringify([...wrongSet])); updateWrongCount()}
wrongSet=loadWrong(); updateWrongCount();

function updateWrongCount(){document.getElementById('wrongCount').textContent=wrongSet.size}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function clearWrong(){
  if(wrongSet.size === 0) {
    alert("目前沒有錯題紀錄喔！");
    return;
  }
  if(confirm("確定要清空所有紀錄的錯題嗎？此動作無法復原。")){
    wrongSet.clear();
    saveWrong();
    alert("錯題紀錄已清空！");
    if(mode === 'wrong') {
      showNoWrong();
    }
  }
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  if(m==='exam') document.getElementById('examBtn').classList.add('active');
  else if(m==='all') document.getElementById('allBtn').classList.add('active');
  else if(m==='wrong') document.getElementById('wrongBtn').classList.add('active');
  startExam();
}

function startExam(){
  let source = DATA;
  if(mode==='wrong') source = DATA.filter(x=>wrongSet.has(x.abbr));
  
  if(mode==='wrong' && !source.length){showNoWrong();return}
  
  let shuffled = shuffle(source);
  if(mode==='exam'){
    deck = shuffled.slice(0, 50);
  } else {
    deck = shuffled;
  }
  
  idx=0;correct=0;answered=0;current=null;locked=false;
  document.getElementById('quizCard').style.display='block';
  document.getElementById('resultCard').style.display='none';
  render();
}

function showNoWrong(){
  document.getElementById('quizCard').style.display='none';
  let r=document.getElementById('resultCard');
  r.style.display='block';
  r.innerHTML='<div class="result"><h2>目前沒有錯題 🎉</h2><p>答錯的題目會自動記錄於此。</p><button class="btn primary" onclick="setMode(\'exam\')">開始 50 題模擬考</button></div>';
}

function makeOptions(correctMeaning){
  const pool=[...new Set(DATA.map(x=>x.meaning).filter(x=>x!==correctMeaning))];
  return shuffle([correctMeaning,...shuffle(pool).slice(0,3)]);
}

function render(){
  if(idx>=deck.length){finish();return}
  locked=false;current=deck[idx];
  document.getElementById('counter').textContent=`第 ${idx+1} / ${deck.length} 題`;
  
  if(mode==='exam') {
    document.getElementById('accuracy').textContent=`當前得分: ${correct * 2} 分`;
  } else {
    document.getElementById('accuracy').textContent=answered?`正確率 ${Math.round(correct/answered*100)}%`:'';
  }
  
  document.getElementById('bar').style.width=((idx)/deck.length*100)+'%';
  document.getElementById('abbr').textContent=current.abbr;
  
  const opts=makeOptions(current.meaning), box=document.getElementById('options');
  box.innerHTML='';
  const letters=['A','B','C','D'];
  opts.forEach((o,i)=>{
    let b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="letter">${letters[i]}.</span>${escapeHtml(o)}`;
    b.onclick=()=>answer(b,o);
    box.appendChild(b);
  });
  
  const fb=document.getElementById('feedback');
  fb.className='feedback';
  fb.innerHTML='';
  document.getElementById('nextBtn').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

function answer(btn,choice){
  if(locked)return;
  locked=true;
  answered++;
  const buttons=[...document.querySelectorAll('.opt')];
  const ok=choice===current.meaning;
  
  if(ok){
    correct++;
    wrongSet.delete(current.abbr);
    btn.classList.add('correct');
    document.getElementById('feedback').className='feedback good';
    document.getElementById('feedback').innerHTML='✓ 答對了！';
  } else {
    wrongSet.add(current.abbr);
    btn.classList.add('wrong');
    buttons.forEach(b=>{
      if(b.textContent.slice(3)===current.meaning || b.innerHTML.includes(escapeHtml(current.meaning))){
        b.classList.add('correct');
      } else if(b!==btn){
        b.classList.add('dim');
      }
    });
    document.getElementById('feedback').className='feedback bad';
    document.getElementById('feedback').innerHTML=`✗ 答錯了<br>正確答案：<strong>${escapeHtml(current.meaning)}</strong>`;
  }
  
  saveWrong();
  buttons.forEach(b=>b.disabled=true);
  document.getElementById('nextBtn').style.display='block';
  
  if(mode==='exam') {
    document.getElementById('accuracy').textContent=`當前得分: ${correct * 2} 分`;
  } else {
    document.getElementById('accuracy').textContent=`正確率 ${Math.round(correct/answered*100)}%`;
  }
}

function nextQuestion(){idx++;render()}
function skipQuestion(){if(locked)return;idx++;render()}

function finish(){
  document.getElementById('quizCard').style.display='none';
  const r=document.getElementById('resultCard');
  r.style.display='block';
  
  if(mode==='exam') {
    const finalScore = correct * 2;
    const isPass = finalScore >= 80;
    const scoreClass = isPass ? 'pass' : 'fail';
    const evalText = isPass ? '🎉 恭喜及格！觀念很紮實喔！' : '💪 差一點點，再多複習錯題吧！';
    
    r.innerHTML=`<div class="result">
      <div>模擬考得分</div>
      <div class="score ${scoreClass}">${finalScore} <span style="font-size:24px;color:var(--text)">分</span></div>
      <p>${evalText}<br>答對 ${correct} / 50 題 (錯題庫累積 ${wrongSet.size} 題)</p>
      <div class="row">
        <button class="btn primary" onclick="startExam()">再考一次 (隨機50題)</button>
        <button class="btn secondary" onclick="setMode('wrong')">重考錯題</button>
      </div>
    </div>`;
  } else {
    const pct=answered?Math.round(correct/answered*100):0;
    r.innerHTML=`<div class="result">
      <div>本次刷題完成</div>
      <div class="score">${pct}%</div>
      <p>${correct} / ${answered} 題答對<br>錯題庫累積 ${wrongSet.size} 題</p>
      <div class="row">
        <button class="btn primary" onclick="startExam()">重新刷題</button>
        <button class="btn secondary" onclick="setMode('wrong')">重考錯題</button>
      </div>
    </div>`;
  }
